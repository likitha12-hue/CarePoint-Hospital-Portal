{% extends "hospital/base.html" %}
{% block title %}Login · CarePoint{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="cp-card p-4 p-md-5">
      <div class="text-center mb-4"><span class="cp-logo lg"><i class="bi bi-heart-pulse-fill"></i></span>
        <h3 class="fw-bold mt-3 mb-1">Welcome back</h3><p class="text-muted">Login to manage your appointments</p></div>
      <form method="post">
        {% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger py-2">Wrong username or password.</div>{% endif %}
        <div class="mb-3"><label class="form-label">Username</label>
          <input type="text" name="username" class="form-control form-control-lg" required autofocus></div>
        <div class="mb-4"><label class="form-label">Password</label>
          <input type="password" name="password" class="form-control form-control-lg" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary btn-lg w-100">Login</button>
      </form>
      <p class="text-center mt-4 mb-0 small">New patient? <a href="{% url 'hospital:register' %}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
